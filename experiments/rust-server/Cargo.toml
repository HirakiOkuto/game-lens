[package]
name = "lens-server"
version = "0.1.0"
edition = "2021"
description = "Prototype: game-lens's server (text reader + translation + cache) in Rust, to measure size, start-up and memory"

[dependencies]
ort = { version = "=2.0.0-rc.15", features = ["directml"] }
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
rusqlite = { version = "0.43", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
